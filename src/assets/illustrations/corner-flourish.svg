<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="corGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C98C"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A28"/>
    </linearGradient>
  </defs>

  <!-- corner L frame -->
  <path d="M6,58 Q6,6 58,6" fill="none" stroke="url(#corGold)" stroke-width="2.4"/>
  <path d="M14,58 Q14,14 58,14" fill="none" stroke="url(#corGold)" stroke-width="1.2" opacity="0.7"/>

  <!-- paisley curl -->
  <path d="M22,40 Q18,24 32,18 Q46,13 48,26 Q50,37 38,39 Q30,40 29,33 Q28,27 34,27"
        fill="none" stroke="url(#corGold)" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="36" cy="30" r="2.2" fill="#D4AF37" opacity="0.8"/>

  <!-- leaves -->
  <path d="M44,10 Q52,14 50,24 Q42,20 44,10 Z" fill="#2D5016" opacity="0.85"/>
  <path d="M10,44 Q14,52 24,50 Q20,42 10,44 Z" fill="#2D5016" opacity="0.85"/>

  <!-- marigold cluster -->
  <circle cx="20" cy="52" r="6" fill="#FF9E1B"/>
  <circle cx="20" cy="52" r="2.6" fill="#FFD27A" opacity="0.8"/>
  <circle cx="31" cy="55" r="4.4" fill="#E8630A"/>
  <circle cx="52" cy="20" r="6" fill="#FF9E1B"/>
  <circle cx="52" cy="20" r="2.6" fill="#FFD27A" opacity="0.8"/>
  <circle cx="55" cy="31" r="4.4" fill="#E94560"/>

  <!-- gold dots trailing -->
  <g fill="#D4AF37" opacity="0.75">
    <circle cx="42" cy="46" r="1.6"/>
    <circle cx="48" cy="40" r="1.3"/>
    <circle cx="40" cy="52" r="1.1"/>
  </g>
</svg>
