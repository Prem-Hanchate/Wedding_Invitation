<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="diyaClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C46A3B"/>
      <stop offset="60%" stop-color="#8E4522"/>
      <stop offset="100%" stop-color="#5E2C14"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFB347" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="45%" stop-color="#FFC24B"/>
      <stop offset="100%" stop-color="#F2711C"/>
    </linearGradient>
  </defs>

  <!-- ambient glow -->
  <ellipse class="diya-flame" cx="40" cy="30" rx="24" ry="26" fill="url(#flameGlow)"/>

  <!-- flame -->
  <path class="diya-flame" d="M40,12 Q47,24 44,32 Q42,37 40,38 Q38,37 36,32 Q33,24 40,12 Z" fill="url(#flameBody)"/>
  <path class="diya-flame" d="M40,22 Q43,28 41.5,33 Q40,36 38.5,33 Q37,28 40,22 Z" fill="#FFF7DA"/>

  <!-- wick -->
  <line x1="40" y1="38" x2="40" y2="46" stroke="#4A2C11" stroke-width="1.6"/>

  <!-- bowl -->
  <path d="M14,48 Q40,42 66,48 Q62,64 40,66 Q18,64 14,48 Z" fill="url(#diyaClay)" stroke="#4A2010" stroke-width="1.2"/>
  <path d="M14,48 Q40,54 66,48" fill="none" stroke="#E8A05E" stroke-width="1.6" opacity="0.8"/>

  <!-- bead decorations on rim -->
  <g fill="#D8B370">
    <circle cx="22" cy="52" r="1.7"/>
    <circle cx="31" cy="54.5" r="1.7"/>
    <circle cx="40" cy="55.4" r="1.9"/>
    <circle cx="49" cy="54.5" r="1.7"/>
    <circle cx="58" cy="52" r="1.7"/>
  </g>

  <!-- base -->
  <path d="M30,66 L28,72 L52,72 L50,66" fill="#5E2C14" stroke="#3E1B0B" stroke-width="1"/>
</svg>
