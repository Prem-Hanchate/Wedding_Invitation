<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="dholWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887"/>
      <stop offset="50%" style="stop-color:#CD853F"/>
      <stop offset="100%" style="stop-color:#A0522D"/>
    </linearGradient>
    <linearGradient id="dholSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6D3"/>
      <stop offset="100%" style="stop-color:#E8D4C0"/>
    </linearGradient>
  </defs>
  
  <!-- Dhol drum body (side view) -->
  <ellipse cx="40" cy="55" rx="28" ry="12" fill="url(#dholWood)" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Drum head (top surface) -->
  <ellipse cx="40" cy="40" rx="28" ry="10" fill="url(#dholSkin)" stroke="#8B4513" stroke-width="1.5"/>
  
  <!-- Tension ropes/laces around drum -->
  <g stroke="#8B4513" stroke-width="1" fill="none">
    <path d="M15,45 Q12,50 15,55"/>
    <path d="M25,47 Q23,52 25,57"/>
    <path d="M35,48 Q33,53 35,58"/>
    <path d="M45,48 Q47,53 45,58"/>
    <path d="M55,47 Q57,52 55,57"/>
    <path d="M65,45 Q68,50 65,55"/>
  </g>
  
  <!-- Decorative pattern on drum body -->
  <path d="M18,52 Q40,58 62,52" fill="none" stroke="#A0522D" stroke-width="1" opacity="0.6"/>
  <path d="M18,58 Q40,64 62,58" fill="none" stroke="#A0522D" stroke-width="1" opacity="0.6"/>
  
  <!-- Small decorative dots -->
  <g fill="#8B4513" opacity="0.7">
    <circle cx="22" cy="55" r="1.5"/>
    <circle cx="32" cy="57" r="1.5"/>
    <circle cx="48" cy="57" r="1.5"/>
    <circle cx="58" cy="55" r="1.5"/>
  </g>
  
  <!-- Sound waves / vibration lines (optional decorative element) -->
  <g stroke="#DEB887" stroke-width="1" fill="none" opacity="0.5">
    <path d="M10,35 Q5,38 10,42"/>
    <path d="M8,30 Q2,35 8,40"/>
    <path d="M70,35 Q75,38 70,42"/>
    <path d="M72,30 Q78,35 72,40"/>
  </g>
</svg>
