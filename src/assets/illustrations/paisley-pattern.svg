<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <pattern id="paisleyPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Paisley motif -->
      <path d="M50,10 Q65,25 60,45 Q55,60 50,75 Q45,60 40,45 Q35,25 50,10" 
            fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
      <circle cx="50" cy="35" r="5" fill="#D4AF37" opacity="0.3"/>
      
      <!-- Corner flourishes -->
      <path d="M10,10 Q20,15 15,25 Q10,20 10,10" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      <path d="M90,10 Q80,15 85,25 Q90,20 90,10" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      <path d="M10,90 Q20,85 15,75 Q10,80 10,90" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      <path d="M90,90 Q80,85 85,75 Q90,80 90,90" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.3"/>
      
      <!-- Small floral accents -->
      <circle cx="25" cy="50" r="3" fill="#C9A88A" opacity="0.25"/>
      <circle cx="75" cy="50" r="3" fill="#C9A88A" opacity="0.25"/>
      <circle cx="50" cy="25" r="3" fill="#C9A88A" opacity="0.25"/>
      <circle cx="50" cy="75" r="3" fill="#C9A88A" opacity="0.25"/>
    </pattern>
  </defs>
  
  <!-- Full pattern fill -->
  <rect width="400" height="400" fill="url(#paisleyPattern)"/>
  
  <!-- Additional larger decorative elements for variety -->
  <g fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.2">
    <!-- Vine swirls -->
    <path d="M0,100 Q50,80 100,100 T200,100 T300,100 T400,100"/>
    <path d="M0,200 Q50,180 100,200 T200,200 T300,200 T400,200"/>
    <path d="M0,300 Q50,280 100,300 T200,300 T300,300 T400,300"/>
  </g>
</svg>
