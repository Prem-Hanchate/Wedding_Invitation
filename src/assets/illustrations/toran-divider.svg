<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 20">
  <defs>
    <linearGradient id="marigoldOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA500"/>
      <stop offset="50%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A7C2E"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
  </defs>
  
  <!-- String/thread base -->
  <path d="M5,10 Q60,8 115,10" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Marigold flower clusters repeating pattern -->
  <g class="flower-cluster">
    <!-- Left cluster -->
    <circle cx="15" cy="10" r="6" fill="url(#marigoldOrange)" opacity="0.9"/>
    <circle cx="22" cy="10" r="5" fill="url(#marigoldOrange)" opacity="0.85"/>
    <ellipse cx="18" cy="7" rx="3" ry="4" fill="url(#leafGreen)" opacity="0.7"/>
    
    <!-- Center-left cluster -->
    <circle cx="40" cy="10" r="7" fill="url(#marigoldOrange)" opacity="0.95"/>
    <circle cx="47" cy="10" r="5" fill="url(#marigoldOrange)" opacity="0.85"/>
    <ellipse cx="43" cy="6" rx="3" ry="4" fill="url(#leafGreen)" opacity="0.7"/>
    
    <!-- Center cluster (largest) -->
    <circle cx="60" cy="10" r="8" fill="url(#marigoldOrange)" opacity="1"/>
    <circle cx="68" cy="10" r="6" fill="url(#marigoldOrange)" opacity="0.9"/>
    <circle cx="54" cy="10" r="5" fill="url(#marigoldOrange)" opacity="0.85"/>
    <ellipse cx="60" cy="5" rx="4" ry="5" fill="url(#leafGreen)" opacity="0.75"/>
    
    <!-- Center-right cluster -->
    <circle cx="80" cy="10" r="7" fill="url(#marigoldOrange)" opacity="0.95"/>
    <circle cx="87" cy="10" r="5" fill="url(#marigoldOrange)" opacity="0.85"/>
    <ellipse cx="83" cy="6" rx="3" ry="4" fill="url(#leafGreen)" opacity="0.7"/>
    
    <!-- Right cluster -->
    <circle cx="105" cy="10" r="6" fill="url(#marigoldOrange)" opacity="0.9"/>
    <circle cx="98" cy="10" r="5" fill="url(#marigoldOrange)" opacity="0.85"/>
    <ellipse cx="102" cy="7" rx="3" ry="4" fill="url(#leafGreen)" opacity="0.7"/>
  </g>
  
  <!-- Small hanging bells/decorations -->
  <g fill="#D4AF37" opacity="0.8">
    <circle cx="30" cy="15" r="2"/>
    <circle cx="70" cy="16" r="2.5"/>
    <circle cx="95" cy="15" r="2"/>
  </g>
  
  <!-- Subtle decorative dots along string -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="10" cy="10" r="1"/>
    <circle cx="35" cy="10" r="1"/>
    <circle cx="50" cy="10" r="1"/>
    <circle cx="75" cy="10" r="1"/>
    <circle cx="90" cy="10" r="1"/>
    <circle cx="110" cy="10" r="1"/>
  </g>
</svg>
