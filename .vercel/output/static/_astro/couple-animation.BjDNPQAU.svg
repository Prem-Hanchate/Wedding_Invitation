<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180">
  <defs>
    <linearGradient id="cpGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c1d2e"/>
      <stop offset="100%" stop-color="#4c0d18"/>
    </linearGradient>
    <linearGradient id="cpBride" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0982f"/>
      <stop offset="55%" stop-color="#b8471c"/>
      <stop offset="100%" stop-color="#8e1626"/>
    </linearGradient>
    <radialGradient id="cpHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7e2a8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f7e2a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- golden halo behind the couple -->
  <circle class="cp-halo" cx="130" cy="70" r="62" fill="url(#cpHalo)"/>

  <!-- ======================= GROOM (left) ======================= -->
  <g class="cp-groom">
    <!-- sherwani body -->
    <path d="M78,168 L78,104 Q78,86 96,82 L112,82 Q128,86 128,104 L128,168 Z" fill="url(#cpGroom)" stroke="#d8b370" stroke-width="1.4"/>
    <!-- gold buttons & trim -->
    <path d="M103,84 L103,168" stroke="#d8b370" stroke-width="1.2" opacity=".85"/>
    <circle cx="103" cy="98" r="1.8" fill="#f0dfb4"/>
    <circle cx="103" cy="114" r="1.8" fill="#f0dfb4"/>
    <circle cx="103" cy="130" r="1.8" fill="#f0dfb4"/>
    <circle cx="103" cy="146" r="1.8" fill="#f0dfb4"/>
    <!-- dupatta / stole over shoulder -->
    <path d="M84,88 Q76,120 88,158 L98,158 Q88,120 94,90 Z" fill="#d8b370" opacity=".8"/>
    <!-- necklace of flowers -->
    <path d="M92,86 Q103,102 114,86" fill="none" stroke="#FF9E1B" stroke-width="3" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="103" cy="62" r="15" fill="#c98d5e"/>
    <!-- hair -->
    <path d="M88,58 Q90,44 103,44 Q116,44 118,58 Q112,50 103,50 Q94,50 88,58 Z" fill="#241109"/>
    <!-- smile -->
    <path d="M98,68 Q103,72 108,68" fill="none" stroke="#5b2c17" stroke-width="1.4" stroke-linecap="round"/>
    <!-- eyes -->
    <circle cx="98" cy="61" r="1.5" fill="#241109"/>
    <circle cx="108" cy="61" r="1.5" fill="#241109"/>
    <!-- mustache -->
    <path d="M97,65 Q103,67 109,65" stroke="#241109" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- pagdi / sehra turban -->
    <path d="M86,52 Q103,30 120,52 L120,46 Q103,26 86,46 Z" fill="#e0982f" stroke="#d8b370" stroke-width="1"/>
    <path d="M86,49 Q103,34 120,49" fill="none" stroke="#7c1d2e" stroke-width="2"/>
    <!-- kalgi gem on turban -->
    <circle cx="118" cy="44" r="3" fill="#e94560" stroke="#f0dfb4" stroke-width="1"/>
    <!-- sehra strands -->
    <g class="cp-sehra" stroke="#f0dfb4" stroke-width="1" opacity=".9">
      <path d="M92,52 L92,62"/><path d="M98,52 L98,64"/><path d="M104,52 L104,64"/><path d="M110,52 L110,62"/>
    </g>
    <!-- arm reaching to bride -->
    <path d="M126,100 Q140,112 146,124" fill="none" stroke="url(#cpGroom)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="147" cy="126" r="5" fill="#c98d5e"/>
  </g>

  <!-- ======================= BRIDE (right) ======================= -->
  <g class="cp-bride">
    <!-- saree / lehenga flare -->
    <path d="M138,168 Q136,110 158,88 L176,88 Q198,110 196,168 Z" fill="url(#cpBride)" stroke="#d8b370" stroke-width="1.4"/>
    <!-- saree border patterns -->
    <path d="M141,160 Q166,150 193,160" fill="none" stroke="#f0dfb4" stroke-width="1.6" opacity=".8"/>
    <path d="M140,150 Q166,140 194,150" fill="none" stroke="#d8b370" stroke-width="1" opacity=".6"/>
    <!-- pallu over shoulder -->
    <path d="M182,92 Q196,120 186,162 L176,162 Q186,122 174,94 Z" fill="#d8b370" opacity=".75"/>
    <!-- blouse -->
    <path d="M154,88 L180,88 L178,102 L156,102 Z" fill="#8e1626" stroke="#d8b370" stroke-width="1"/>
    <!-- necklace -->
    <path d="M158,90 Q167,102 176,90" fill="none" stroke="#f0dfb4" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="167" cy="100" r="2.4" fill="#e94560"/>
    <!-- head -->
    <circle cx="167" cy="64" r="14.5" fill="#d59a6a"/>
    <!-- hair -->
    <path d="M152,64 Q150,44 167,44 Q184,44 182,64 L182,72 Q178,58 167,56 Q156,58 152,72 Z" fill="#241109"/>
    <!-- braid with flowers -->
    <path d="M181,66 Q192,84 186,106" fill="none" stroke="#241109" stroke-width="7" stroke-linecap="round"/>
    <circle cx="184" cy="78" r="2.4" fill="#FF9E1B"/>
    <circle cx="187" cy="90" r="2.4" fill="#E94560"/>
    <circle cx="186" cy="100" r="2.4" fill="#FFC24B"/>
    <!-- maang tikka -->
    <path d="M167,46 L167,54" stroke="#f0dfb4" stroke-width="1.4"/>
    <circle cx="167" cy="55" r="2.4" fill="#e94560" stroke="#f0dfb4" stroke-width=".8"/>
    <!-- bindi -->
    <circle cx="167" cy="60" r="1.8" fill="#b8121f"/>
    <!-- eyes & smile -->
    <circle cx="162" cy="64" r="1.4" fill="#241109"/>
    <circle cx="172" cy="64" r="1.4" fill="#241109"/>
    <path d="M162,70 Q167,74 172,70" fill="none" stroke="#7a3418" stroke-width="1.4" stroke-linecap="round"/>
    <!-- earring -->
    <circle cx="153" cy="68" r="2" fill="#f0dfb4"/>
    <!-- arm reaching to groom (joined hands) -->
    <path d="M152,102 Q146,114 146,124" fill="none" stroke="#d59a6a" stroke-width="7" stroke-linecap="round"/>
    <!-- bangles -->
    <g stroke="#f0dfb4" stroke-width="1.4">
      <path d="M143,112 L150,112"/><path d="M143,115 L150,115"/>
    </g>
    <!-- ghoonghat veil edge -->
    <path d="M150,50 Q167,36 186,52 Q190,66 184,74" fill="none" stroke="#d8b370" stroke-width="1.6" opacity=".8"/>
  </g>

  <!-- joined hands garland tie -->
  <circle class="cp-tie" cx="146.5" cy="125" r="6" fill="none" stroke="#FF9E1B" stroke-width="3"/>

  <!-- flower rain dots -->
  <g class="cp-flowers" fill="#FFC24B">
    <circle cx="70" cy="30" r="2.6"/>
    <circle cx="130" cy="18" r="2.2" fill="#E94560"/>
    <circle cx="196" cy="28" r="2.6"/>
    <circle cx="104" cy="14" r="2" fill="#FF9E1B"/>
    <circle cx="162" cy="12" r="2" fill="#F0DFB4"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="130" cy="170" rx="70" ry="6" fill="#000" opacity=".28"/>
</svg>
